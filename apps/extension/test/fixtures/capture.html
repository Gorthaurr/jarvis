<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Снимок вкладки</title>
<style>
  html, body { margin: 0; background: #fff; height: 3000px; }
  #red { position: absolute; left: 40px; top: 30px; width: 100px; height: 50px; background: rgb(255, 0, 0); }
  #far { position: absolute; left: 60px; top: 2000px; width: 120px; height: 40px; background: rgb(0, 255, 0); border: 0; }
</style>
</head>
<body>
<div id="red"></div>
<button id="far" aria-label="Кнопка внизу"></button>
</body>
</html>
